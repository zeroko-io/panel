name: ci

# One build per commit, like the runner's. A push to main (or a pull request)
# checks the code, builds the panel's image and checks that it starts; on main
# it publishes the image as sha-<commit> and, while that commit is main's
# newest, dev. A vX.Y.Z tag builds nothing: once main's run of that commit
# has passed, it names that same image X.Y.Z, X.Y, X (from 1.0) and latest
# and makes the GitHub release from CHANGELOG.md.
#
# The version is git's: `git describe` of the vX.Y.Z tags, so a release
# pushes its commit and its tag together (git push --atomic origin main
# vX.Y.Z), and the image built for that commit is X.Y.Z.
#
# Changes to docs only run nothing; a release's commit, the changelog's
# alone, runs, as its tag needs its image. Path filters do not apply to tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &code
      - "**"
      - "!**.md"
      - "CHANGELOG.md"
      - "skill.md" # the agents' skill, served by the panel
      - "!LICENSE"
      - "!docker-compose.yml"
      - "!.env.example"
  pull_request:
    paths: *code
  # By hand, on main: the same run as a push, when a push did not start one.
  workflow_dispatch:

permissions:
  contents: read

env:
  CYPRESS_INSTALL_BINARY: "0" # the end-to-end tests run on the VM, not here

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref_type, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,tsx}"

  # The image is built on amd64 for both platforms: its last stage only
  # copies JavaScript, so arm64 needs no emulation.
  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, for the version
      - uses: docker/setup-buildx-action@v4
      # 0.1.0 on a tagged commit, 0.1.0-3-gabc1234 three commits after it.
      - id: meta
        run: |
          v=$(git describe --tags --match 'v[0-9]*' --always)
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build for amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: panel:amd64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Without a runner it still serves its health check and sign-in page.
      - name: The image starts and serves
        run: |
          docker run -d --name panel -p 3000:3000 \
            -e ZEROKO_TOKEN=e2e-root-token-0123456789abcdef0123456789 \
            -e ZEROKO_PANEL_PASSWORD=e2e-password \
            -e ZEROKO_RUNNER_URL=http://127.0.0.1:9 panel:amd64
          for _ in $(seq 30); do curl -sf http://127.0.0.1:3000/healthz >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/healthz
          curl -sf http://127.0.0.1:3000/login | grep -q "Sign in"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 307 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/runner-api/api/services)" = 401 ]
      # The all-in-one image (Dockerfile.aio): the panel with the runner's
      # latest release inside. Both answer, and the panel reaches its runner.
      - name: Build all in one for amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.aio
          platforms: linux/amd64
          load: true
          tags: panel:aio
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=aio
      - name: All in one starts and serves
        run: |
          docker run -d --name aio -p 3001:3000 -p 8080:8080 \
            -e ZEROKO_PANEL_PASSWORD=e2e-password panel:aio
          for _ in $(seq 30); do curl -sf http://127.0.0.1:3001/healthz >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3001/login | grep -q "Sign in"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: nothing.example' http://127.0.0.1:8080/)" = 404 ]
          # Without ZEROKO_TOKEN, the token made on the first start works.
          docker exec aio sh -c 'node -e "fetch(\"http://127.0.0.1:8081/api/services\", { headers: { Authorization: \"Bearer $(cat /data/.root-token)\" } }).then((r) => process.exit(r.ok ? 0 : 1))"'
          [ "$(docker inspect -f '{{.State.Health.Status}}' aio)" != unhealthy ]
      - if: failure()
        name: Logs of a failed check
        run: |
          docker logs panel 2>&1 | tail -200 || true
          docker logs aio 2>&1 | tail -200 || true

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # dev moves only forward: a run that ends after a newer commit reached
      # main publishes its sha-<commit> alone.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: tags
        run: |
          newest=$([ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ] && echo 1 || true)
          for suffix in "" -aio; do
            [ -z "$suffix" ] && echo "tags<<EOF" || echo "aio<<EOF"
            echo "${{ steps.meta.outputs.image }}:sha-$GITHUB_SHA$suffix"
            [ -n "$newest" ] && echo "${{ steps.meta.outputs.image }}:dev$suffix"
            echo "EOF"
          done >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        name: Publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
      # The all-in-one image under the same tags, each with -aio.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        name: Publish all in one
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.aio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.aio }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=aio

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
      contents: write
      packages: write # the image's tags
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Everything that can be wrong with the tag fails here, before waiting.
      - name: Check the tag
        id: check
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          awk -v h="## $v" '$0 == h {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "::error::CHANGELOG.md has no ## $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Wait for main's run of this commit
        run: |
          for i in $(seq 120); do
            run=$(gh run list --workflow ci --branch main --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,url)
            status=$(jq -r '.[0].status // "none"' <<<"$run")
            conclusion=$(jq -r '.[0].conclusion // ""' <<<"$run")
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "::error::main's run of this commit ended in $conclusion: $(jq -r '.[0].url' <<<"$run")"
              exit 1
            fi
            [ "$status" = none ] && [ "$i" -ge 6 ] && { echo "::error::main has no run of this commit (docs only?)"; exit 1; }
            sleep 30
          done
          echo "::error::main's run of this commit did not end in an hour"
          exit 1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the tested image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          v="${{ steps.check.outputs.version }}"
          built=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{json .Image}}' \
            | jq -r '.["linux/amd64"].config.Labels["org.opencontainers.image.version"]')
          [ "$built" = "$v" ] || { echo "::error::this commit's image is $built, not $v: push the tag with its commit (git push --atomic origin main $GITHUB_REF_NAME)"; exit 1; }
          for suffix in "" -aio; do
            tags=(-t "$image:$v$suffix" -t "$image:${v%.*}$suffix" -t "$image:latest$suffix")
            [[ "$v" == 0.* ]] || tags+=(-t "$image:${v%%.*}$suffix")
            docker buildx imagetools create "${tags[@]}" "$image:sha-$GITHUB_SHA$suffix"
            docker buildx imagetools inspect "$image:$v$suffix"
          done
      - name: GitHub release
        run: |
          v="${{ steps.check.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Zeroko Panel $v" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Zeroko Panel $v" --notes-file notes.md
          fi
